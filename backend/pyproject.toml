[project]
name = "crowdpod"
version = "0.1.0"
description = "Test a product idea on a simulated crowd before you build it."
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openai>=1.40",
  "playwright>=1.45",
]

[project.scripts]
crowdpod = "crowdpod.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdpod"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
